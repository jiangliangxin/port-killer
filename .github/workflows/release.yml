name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/set-version.mjs

      - name: Build portable release
        run: pnpm release

      - name: Verify release files
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "release/port-killer.exe")) { throw "Missing exe" }
          if (-not (Test-Path -LiteralPath "release/port-killer.sha256.txt")) { throw "Missing sha256" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/port-killer.exe
            release/port-killer.sha256.txt

  macos:
    name: Build macOS DMG
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.30.3 --activate

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node scripts/set-version.mjs

      - name: Add universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal DMG
        run: |
          pnpm tauri build --target universal-apple-darwin
          node scripts/post-build-release.mjs

      - name: Verify release files
        run: |
          test -f release/*.dmg || { echo "Missing DMG"; exit 1; }
          test -f release/*.sha256.txt || { echo "Missing sha256"; exit 1; }

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.sha256.txt

  publish:
    name: Publish GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: release/macos

      - name: List artifacts
        run: |
          echo "=== windows ==="
          ls -la release/windows
          echo "=== macos ==="
          ls -la release/macos

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="$(printf 'Port Killer %s\n\nAssets built via GitHub Actions.\nWindows assets require the WebView2 runtime (built in on Windows 11 and up-to-date Windows 10).' "$tag")"

          if gh release view "$tag" >/dev/null 2>&1; then
            # tag 重跑时覆盖同名资产，而不是直接失败
            gh release upload "$tag" --clobber release/windows/* release/macos/*
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes "$notes" \
              release/windows/* \
              release/macos/*
          fi
